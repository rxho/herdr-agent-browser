id = "rxho.agent-browser"
name = "Agent Browser"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "CDP browser viewer with cooperative human handoff and optional Ovis web-panel integration"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci", "--no-audit", "--no-fund"]

[[build]]
command = ["npm", "run", "build"]

[[startup]]
command = ["bash", "scripts/start.sh"]

[[actions]]
id = "open-web-panel"
title = "Open Agent Browser in Ovis"
description = "Open the browser viewer using Ovis's web-panel protocol (on supported Ovis builds)"
contexts = ["global", "workspace", "pane"]
command = ["bash", "scripts/with-node.sh", "scripts/open-panel.mjs"]

[[actions]]
id = "open-browser-pane"
title = "Open Agent Browser link pane"
description = "Opens a Herdr pane with a clickable browser viewer link; compatible with current Ovis releases"
contexts = ["global", "workspace", "pane"]
command = ["bash", "scripts/open-browser-pane.sh"]

[[panes]]
id = "browser"
title = "Agent Browser"
placement = "split"
command = ["bash", "scripts/with-node.sh", "scripts/browser-pane.mjs"]

[[actions]]
id = "start"
title = "Start browser viewer"
command = ["bash", "scripts/start.sh"]

[[actions]]
id = "stop"
title = "Stop browser viewer"
command = ["bash", "scripts/stop.sh"]

[[actions]]
id = "start-browser"
title = "Launch isolated Chrome browser"
command = ["bash", "scripts/start-browser.sh"]

[[actions]]
id = "install-browser"
title = "Install isolated browser"
description = "Install the pinned Chrome for Testing build in the plugin's private browser cache"
command = ["bash", "scripts/with-node.sh", "scripts/install-browser.mjs"]

[[actions]]
id = "stop-browser"
title = "Stop isolated Chrome browser"
command = ["bash", "scripts/stop-browser.sh"]

[[actions]]
id = "status"
title = "Browser viewer status"
command = ["bash", "scripts/status.sh"]
