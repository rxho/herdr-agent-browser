id = "rxho.agent-browser"
name = "Agent Browser"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "CDP browser viewer and human takeover, powered by @agent-infra/browser-ui, compatible with Ovis or any Herdr client"
platforms = ["macos", "linux"]
[[build]]
command = ["npm", "install", "--no-audit", "--no-fund"]
[[build]]
command = ["npm", "run", "build"]
[[startup]]
command = ["bash", "scripts/start.sh"]
[[actions]]
id = "start"
title = "Start browser viewer"
command = ["bash", "scripts/start.sh"]
[[actions]]
id = "stop"
title = "Stop browser viewer"
command = ["bash", "scripts/stop.sh"]
[[actions]]
id = "status"
title = "Browser viewer status"
command = ["bash", "scripts/status.sh"]
