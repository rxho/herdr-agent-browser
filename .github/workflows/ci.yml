name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Linux browser E2E (installed Chrome)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          CHROME_BIN="$CHROME_BIN" npm run test:e2e

      - name: Node 24 for native agent-browser (core plugin still checked on Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Conversation-scoped MCP E2E (real Chrome)
        run: |
          npm install --no-save --no-package-lock agent-browser@0.39.2
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" \
          HAB_AGENT_BROWSER_BINARY="$PWD/node_modules/.bin/agent-browser" \
          timeout 180s node tests/conversation-e2e.mjs

      - name: Publish v0.6.0 pre-release after green main CI
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.6.0]')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.6.0 \
            --target "${{ github.sha }}" \
            --title "v0.6.0 — Conversation-scoped MCP and shared browser sessions" \
            --notes-file docs/v0.6.0-release-notes.md \
            --prerelease
