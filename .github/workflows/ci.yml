name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Linux browser E2E (installed Chrome)
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          CHROME_BIN="$CHROME_BIN" npm run test:e2e
